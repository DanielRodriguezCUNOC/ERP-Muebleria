<div class="fixed inset-0 z-50 flex items-center justify-center bg-slate-900/60 backdrop-blur-sm p-4">
  <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl border border-slate-200 overflow-hidden">

    <!-- Header -->
    <div class="bg-rose-50 border-b border-rose-100 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="p-2 bg-rose-100 text-rose-700 rounded-xl">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
          </svg>
        </div>
        <div>
          <h3 class="text-base font-bold text-rose-900">Anular Orden de Compra</h3>
          <p class="text-xs text-rose-700 font-medium">Compra #{{ compraId() }}</p>
        </div>
      </div>
      <button (click)="cerrar()" [disabled]="isLoading()"
        class="text-slate-400 hover:text-slate-600 transition disabled:opacity-50">
        ✕
      </button>
    </div>

    <!-- Body -->
    <div class="p-6 space-y-4">
      <p class="text-xs text-slate-600 leading-relaxed">
        Esta acción revertirá las existencias en el inventario y registrará la operación en la bitácora del sistema.
      </p>

      @if (errorMessage()) {
      <div class="p-3 bg-rose-100 border border-rose-200 text-rose-800 rounded-xl text-xs font-semibold">
        {{ errorMessage() }}
      </div>
      }

      <div>
        <label class="block text-xs font-medium text-slate-700 mb-1">Motivo de Anulación *</label>
        <textarea rows="4" placeholder="Escribe la razón detallada de la anulación (mínimo 10 caracteres)..."
          [(ngModel)]="motivo" [disabled]="isLoading()"
          class="w-full px-3 py-2 bg-slate-50 border border-slate-300 rounded-xl text-xs font-medium text-slate-800 focus:ring-2 focus:ring-rose-500 outline-none resize-none disabled:opacity-50"></textarea>
      </div>
    </div>

    <!-- Footer -->
    <div class="bg-slate-50 border-t border-slate-100 px-6 py-3 flex justify-end gap-3">
      <button (click)="cerrar()" [disabled]="isLoading()"
        class="px-4 py-2 bg-white border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold rounded-xl text-xs transition disabled:opacity-50">
        Cancelar
      </button>

      <button (click)="confirmarAnulacion()" [disabled]="isLoading()"
        class="px-4 py-2 bg-rose-600 hover:bg-rose-700 text-white font-semibold rounded-xl text-xs shadow-md shadow-rose-600/20 transition flex items-center gap-2 disabled:opacity-50">
        @if (isLoading()) {
        <div class="animate-spin h-3.5 w-3.5 border-2 border-white border-t-transparent rounded-full"></div>
        <span>Anulando...</span>
        } @else {
        <span>Confirmar Anulación</span>
        }
      </button>
    </div>

  </div>
</div>
